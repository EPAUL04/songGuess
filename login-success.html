<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Guess My Song</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css">
        <link rel="shortcut icon" type="image/x-icon" href="images/blank.jpg">
        <script src="js/script.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body onload="requestProfile()">
        <div id="box">
            <header>
                <h1> &nbsp; Guess My Song</h1>
            </header>
    
            <nav>
                <p>Welcome, <span id="name"></span></p>
            </nav>
        </div>
        
        <main>
            <!-- <p>should eventually be multiselect but for now we'll do text areas and they'll have to guess perfectly</p>
            <p>
                on right should be a mockup of the song image stuff in spotify, so like a big square where the album art 
                will go, title and artist as normal. then under, it'll be a couple labels (playlists, genres). as clues 
                are given, things are filled in. and if someone guesses a song that shares traits with the actual answer, 
                those shared traits should be filled in. eg if the song is king for a day and i guess disasterology, ptv 
                should be filled in as the artist
            </p>
            <p>
                and then only the first guess stuff should propogate initially; the submit() function will validate the guess 
                and either end the game and call win() or will propogate the next set of guesses and add additional clues as 
                needed. the last guess stuff will call finalSubmit() which just validates guess and says whether they won or lost
            </p> -->
            <form>
                <div id="1">
                    <label for="guess1">First guess: <b>+your playlist containing this song</b></label>
                    <input type="text" id="answer1" name="answer1">
                    <label onclick="submit(1)" class="submit" id="submit1">submit</label>
                </div>

                <div id="2">
                    <label for="guess2">Second guess: <b>+when you first discovered this song</b></label>
                    <input type="text" id="answer2" name="answer2">
                    <label onclick="submit(2)" class="submit" id="submit2">submit</label>
                </div>
                
                <div id="3">
                    <label for="guess3">Third guess: <b>+artist name(s)</b></label>
                    <input type="text" id="answer3" name="answer3">
                    <label onclick="submit(3)" class="submit" id="submit3">submit</label>
                </div>
                
                <div id="4">
                    <label for="guess4">Fourth guess: <b>+album name</b></label>
                    <input type="text" id="answer4" name="answer4">
                    <label onclick="submit(4)" class="submit" id="submit4">submit</label>
                </div>
                
                <div id="5">
                    <label for="guess5">Fifth guess:</label>
                    <input type="text" id="answer5" name="answer5">
                    <label onclick="submit(5)" class="submit" id="submit5">submit</label>
                </div>
                
                <div id="6">
                    <label for="guess6">Sixth guess: <b>+first letter of song title</b></label>
                    <input type="text" id="answer6" name="answer6">
                    <label onclick="submit(6)" class="submit" id="submit6">submit</label>
                </div>
                
                <div id="7">
                    <label for="guess7">Last guess!</label>
                    <input type="text" id="answer7" name="answer7">
                    <label onclick="submitFinal()" class="submit" id="submit7">submit</label>
                </div>
            </form>

            <div id="display">
                <img src="images/blank.jpg" width="30%" height="30%" alt="" id="display-image">
                <h2 id="display-title">(title)</h2>
                <h3 id="display-artists">(artist)</h3>
                <h3 id="display-album">(album)</h3>
                <p>You have added this song to the playlist: <span id="display-playlist"></span></p>
                <p>You first added this song to your library: <span id="display-added"></span></p>
            </div>

            <div id="gamestate"style="margin-bottom: 1em;">
                <button onclick="start()" id="start" >Select a song!</button>
            </div>

            <div style="pointer-events: none; margin-top: 1em;" id="reset">
                <a href="index.html"><button id="reset-button" style="background-color: gray; border-radius: 5px; text-decoration: none;">Play again</button></a>
            </div>
        </main>
        <footer>
            <p>io ✩ date updated: 08.05.2026 ✩ contact me via <a href="mailto:eandepaul@gmail.com">email</a></p>
        </footer>
    </body>
</html>
